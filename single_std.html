<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card {
    background-color: white;
    border: 1px solid #e2e8f0;
    border-radius: 15px;
    padding:0;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    max-width: 700px;
    margin: 30px auto;
}



/* Student Image */
.card img {
    width: 100%;
    height: 200px;
    object-fit: contain;
    display: block;
}

/* Student Information */
.content {
    padding: 20px 25px;
}

.content h2 {
    font-size: 17px;
    color: #173b70;
    margin-bottom: 12px;
}

.content p {
    font-size: 13px;
    color: #475569;
    line-height: 1.8;
}

/* View Button */
.content a {
    display: block;
    text-align: center;
    background-color: #2563eb;
    color: white;
    padding: 9px;
    margin-top: 10px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    transition: 0.3s;
}

.content a:hover {
    background-color: #173b70;
}
.present {
    color: #16a34a;
    background-color: #dcfce7;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: bold;
    width: fit-content;
}

.absent {
    color: #dc2626;
    background-color: #fee2e2;
    padding: 5px 12px;
    border-radius: 20px;
    font-weight: bold;
    width: fit-content;
}
    </style>
</head>
<body>
      <div class="card">

            <img src="{{std[6]}}" alt="Student Image">

            <div class="content">

                <h2>{{std[1]}}</h2>

                <p>Age: {{std[2]}}</p>

                <p>Gender: {{std[3]}}</p>

                <p>Marks: {{std[4]}}</p>

                <p>Course: {{std[5]}}</p>
                {% if std[7] %}
                <p class="present">Present</p>
                {%else%}
                <p class="absent">Absent</p>
                {% endif %}

                <a href="/">Back to Home</a>

            </div>

        </div>
    
</body>
</html>
