<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
     * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background-color: #f1f5fb;
    font-family: Arial, sans-serif;
    color: #1e293b;
}
.header{
    
    display: flex;
    justify-content: space-evenly;
    background-color: black;
    color: white;
}

/* Main Heading */
h1 {
    text-align: center;
    color: white;
    margin: 25px 0;
    font-size: 30px;
    letter-spacing: 1px;
}

/* Add Student Button */
.add {
    display: inline-block;
    margin: 5px 0 20px 5%;
    padding: 12px 25px;
    background-color: #2563eb;
    color: white;
    text-decoration: none;
    border: 2px solid #1e40af;
    border-radius: 10px;
    font-size: 15px;
    font-weight: bold;
    transition: 0.3s ease;
    text-align: center;

}

.add:hover {
    background-color: #173b70;
}

/* Student Cards Container */
.container {
    width: 90%;
    margin: 20px auto;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 22px;
}

/* Individual Student Card */
.card {
    background-color: white;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 3px 12px rgba(0,0,0,0.07);
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 20px rgba(37,99,235,0.15);
}

/* Student Image */
.card img {
    width: 100%;
    height: 145px;
    object-fit: cover;
    object-position: center top;
    display: block;
}

/* Student Information */
.content {
    padding: 12px;
}

.content h2 {
    font-size: 17px;
    color: #173b70;
    margin-bottom: 9px;
}

.content p {
    font-size: 13px;
    color: #475569;
    line-height: 1.8;
}

/* View Button */
.content a {
    display: block;
    text-align: center;
    background-color: #2563eb;
    color: white;
    padding: 9px;
    margin-top: 10px;
    border-radius: 6px;
    text-decoration: none;
    font-size: 13px;
    font-weight: bold;
    transition: 0.3s;
}

.content a:hover {
    background-color: #173b70;
}.actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
}

.actions form {
    margin: 0;
}

.view,.update, .delete {
    text-decoration: none;
    border: none;
    padding: 10px 20px;
    border-radius: 5px;
    background-color: #2878d0;
    color: white;
    font-size: 14px;
    cursor: pointer;
    text-align: center;
}

.update:hover, .delete:hover {
    background-color: #1559a5;
}

/* Tablet */
@media (max-width: 1000px) {
    .container {
        grid-template-columns: repeat(3, 1fr);
    }
}

/* Small Tablet */
@media (max-width: 700px) {
    .container {
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
    }
}

/* Mobile */
@media (max-width: 450px) {
    .container {
        grid-template-columns: 1fr;
        width: 85%;
    }

    h1 {
        font-size: 22px;
    }
}

    </style>
</head>
<body>
<div class="header">
    <h1>STUDENT MANAGEMENT SYSTEM</h1>

    <a href="/student/add" class="add">+ Add Student</a>
</div>
    <div class="container">

        {% for std in stds %}

        <div class="card">

            <img src="{{std[6]}}" alt="Student Image">

            <div class="content">

                <h2>{{std[1]}}</h2>

                <p>Age: {{std[2]}}</p>

                <p>Gender: {{std[3]}}</p>

                <p>Marks: {{std[4]}}</p>

                <p>Course: {{std[5]}}</p>
            <div class="actions">
                <a href="/students/{{std[0]}}" class="view">View Student</a>
                <a href="/students/edit/{{std[0]}}" class="update">Update</a>
                <form action="/std/delete/{{std[0]}}" method="post">

                    <button class="delete">Delete</button>
                    
                </form>
                </div>
                 
            </div>

        </div>

        {% endfor %}

    </div>

</body>

</html>
